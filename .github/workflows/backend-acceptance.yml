name: Isolated backend acceptance
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Reviewed disposable backend suite
        type: choice
        required: true
        options:
          - application
          - receipts
permissions:
  contents: read
concurrency:
  group: backend-acceptance-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check target boundaries
        run: node scripts/ci/verify-acceptance-target.mjs
      - name: Check the selected branch contains its reviewed suite
        env:
          ACCEPTANCE_SUITE: ${{ inputs.suite }}
        run: |
          node --input-type=module -e "import {access} from 'node:fs/promises'; const files={application:'docs/security/staging/application-submission-auth-acceptance.mjs',receipts:'docs/security/staging/document-request-storage-acceptance.mjs'}; const file=files[process.env.ACCEPTANCE_SUITE]; if(!file)throw new Error('Unknown suite'); await access(file);"
      - name: Install isolated test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/unidoxia-tools" --no-audit --no-fund supabase@2.122.0 @supabase/supabase-js@2.110.2 postgres@3.4.9
          ln -s "$RUNNER_TEMP/unidoxia-tools/node_modules" node_modules
          echo "$RUNNER_TEMP/unidoxia-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start disposable local Auth, Postgres and Storage
        run: |
          mkdir -p "$RUNNER_TEMP/unidoxia-local"
          supabase init --yes --workdir "$RUNNER_TEMP/unidoxia-local" > "$RUNNER_TEMP/supabase-init.log" 2>&1
          supabase start --workdir "$RUNNER_TEMP/unidoxia-local" --exclude studio,postgres-meta,edge-runtime,logflare,vector,supavisor,imgproxy,realtime > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/unidoxia-local" -o json > "$RUNNER_TEMP/supabase-status.json" 2> "$RUNNER_TEMP/supabase-status.log"
      - name: Run reviewed Auth and database acceptance
        env:
          ACCEPTANCE_SUITE: ${{ inputs.suite }}
          SUPABASE_STATUS_PATH: ${{ runner.temp }}/supabase-status.json
        run: node scripts/ci/run-backend-acceptance.mjs
      - name: Remove disposable stack and data
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --workdir "$RUNNER_TEMP/unidoxia-local" --no-backup > "$RUNNER_TEMP/supabase-stop.log" 2>&1 || true
          fi
